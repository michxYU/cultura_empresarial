<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mvm</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">     
    <link rel="icon" href="img/L.png">
    
</head>
<body>
  <section class="vh-100" style="background-color: #eee;">
    <div class="container py-5 h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col col-xl-10">
                <div class="card" style="border-radius: 1rem;">
                    <div class="row g-0">
                        <div class="col-md-6 col-lg-5 d-none d-md-block">
                            <img src="img/p.jpg"
                                 alt="login form" class="img-fluid" style="border-radius: 1rem 0 0 1rem;" />
                        </div>
                        <div class="col-md-6 col-lg-7 d-flex align-items-center">
                            <div class="card-body p-4 p-lg-5 text-black">

                                <form id="loginForm">

                                    <div class="d-flex align-items-center mb-3 pb-1">

                                        <span class="h1 fw-bold mb-0">Iniciar Sesion</span>
                                    </div>

                                    <h5 class="fw-normal mb-3 pb-3" style="letter-spacing: 1px;">Inicia sesión en tu cuenta</h5>

                                    <div data-mdb-input-init class="form-outline mb-4">
                                        <label for="username" class="form-label">Usuario</label>
                                        <input type="text" class="form-control" id="username" placeholder="Usuario">
                                    </div>

                                    <div data-mdb-input-init class="form-outline mb-4">
                                        <label for="password" class="visually-hidden">Contraseña</label>
                                        <input type="password" class="form-control" id="password" placeholder="Contraseña">
                                    </div>

                                    <div class="pt-1 mb-4">
                                        <button data-mdb-button-init data-mdb-ripple-init class="btn btn-primary btn-lg btn-block" type="submit">Ingresar</button>
                                    </div>

                                    <a class="small text-muted" href="#!">¿Has olvidado tu contraseña?</a>
                                    <p class="mb-5 pb-lg-2" style="color: #444444;">¿No tienes una cuenta?<a href="registro.html"
                                                                                                        style="color: #393f81;">
                                            Regístrate aquí</a></p>

                                </form>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');

        // Credenciales predefinidas por el desarrollador
        const validUsername = "yeris";
        const validPassword = "123";

        loginForm.addEventListener('submit', function (event) {
            event.preventDefault(); // Evita que el formulario se envíe de forma predeterminada

            const enteredUsername = usernameInput.value;
            const enteredPassword = passwordInput.value;

            if (enteredUsername === validUsername && enteredPassword === validPassword) {
                Swal.fire({
                    title: "Acceso concedido",
                    icon: "success",
                    draggable: true
                }).then((result) => {
                    // Redirigir a inicio.html después de que el usuario cierre la alerta
                    window.location.href = "inicio.html";
                });
            } else {
                Swal.fire({
                    icon: "error",
                    title: "Oops...",
                    text: "Credenciales incorrectas. Por favor, inténtalo de nuevo.",
                    footer: '<a href="#">¿Por qué tengo este problema?</a>'
                });
            }
        });
    });
</script>
</body>
</html>
