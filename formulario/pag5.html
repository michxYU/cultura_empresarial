<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cuestionario</title>
    <link rel="stylesheet" href="../estilo/pag1.css">
</head>
<body>

    <div class="rectangulo">
        <div class="prePRINCI">
            <!-- Único formulario con ID para controlarlo por JavaScript -->
            <form id="formulario-largo">
                
                <!-- PREGUNTA 1 -->
                <fieldset>
                    <legend>1. ¿Cómo se encuentra tu nariz en este momento?</legend>
                    <label><input type="radio" name="pre1" value="A" required> A) Respiro con normalidad</label>
                    <label><input type="radio" name="pre1" value="B"> B) Goteo frecuente de moco transparente</label>
                    <label><input type="radio" name="pre1" value="C"> C) Irritación en las fosas</label>
                    <label><input type="radio" name="pre1" value="D"> D) Nariz completamente tapada / congestionada con moco espeso</label>
                </fieldset>

                <!-- PREGUNTA 2 -->
                <fieldset>
                    <legend>2. ¿Con qué frecuencia experimentas los estornudos?</legend>
                    <label><input type="radio" name="pre2" value="A" required> A) Algún estornudo sin importancia</label>
                    <label><input type="radio" name="pre2" value="B"> B) Estornudos esporádicos</label>
                    <label><input type="radio" name="pre2" value="C"> C) Ataques de estornudos seguidos</label>
                    <label><input type="radio" name="pre2" value="D"> D) Fuertes estornudos incontrolables acompañados de picor</label>
                </fieldset>

                <!-- PREGUNTA 3 -->
                <fieldset>
                    <legend>3. ¿Qué sensaciones experimentas en tus ojos?</legend>
                    <label><input type="radio" name="pre3" value="A" required> A) Visión clara / ojos completamente frescos</label>
                    <label><input type="radio" name="pre3" value="B"> B) Ligero cansancio visual o pesadez en párpados</label>
                    <label><input type="radio" name="pre3" value="C"> C) Sensación de ardor o parpadeo constante</label>
                    <label><input type="radio" name="pre3" value="D"> D) Ojos llorosos y con lagrimeo continuo</label>
                </fieldset>

                <!-- PREGUNTA 4 -->
                <fieldset>
                    <legend>4. ¿Qué otro síntoma acompaña a tus molestias?</legend>
                    <label><input type="radio" name="pre4" value="A" required> A) Ningún otro malestar relevante</label>
                    <label><input type="radio" name="pre4" value="B"> B) Leve dolor de cabeza</label>
                    <label><input type="radio" name="pre4" value="C"> C) Sensación de oídos tapados</label>
                    <label><input type="radio" name="pre4" value="D"> D) Cuerpo cortado, escalofríos y congestión general</label>
                </fieldset>

                <!-- PREGUNTA 5 -->
                <fieldset>
                    <legend>5. ¿Qué tan intensos son los síntomas al intentar respirar o realizar actividades?</legend>
                    <label><input type="radio" name="pre5" value="A" required> A) Respiro bien y puedo realizar actividades con normalidad</label>
                    <label><input type="radio" name="pre5" value="B"> B) Ligera molestia al respirar</label>
                    <label><input type="radio" name="pre5" value="C"> C) Dificultad para respirar libremente</label>
                    <label><input type="radio" name="pre5" value="D"> D) Necesidad obligatoria de respirar por la boca debido al bloqueo total</label>
                </fieldset>

                <!-- Botón de Envío -->
                <button type="submit" class="botonE">Enviar</button>
            </form>
        </div>
    </div>

    <!-- Script JavaScript para capturar en variables y guardar -->
    <script>
        document.getElementById('formulario-largo').addEventListener('submit', function(event) {
            // Evita que la página se recargue automáticamente
            event.preventDefault();

            const respuestas = ['pre1', 'pre2', 'pre3', 'pre4', 'pre5'];
            let puntosTotales = 0;
            
            // Valores asignados: A otorga menor puntaje (probabilidad baja para Paracetamol si todo es mínimo), B, C y D otorgan mayor puntaje (Next)
            const valores = { 'A': 1, 'B': 2, 'C': 3, 'D': 4 };

            for (const id of respuestas) {
                const seleccion = document.querySelector(`input[name="${id}"]:checked`)?.value;
                if (seleccion && valores[seleccion]) {
                    puntosTotales += valores[seleccion];
                }
            }

            let resultadoRuta = 3;
            let nombrePastilla = 'Next';

            // Evaluación de puntajes (Mínimo: 5, Máximo: 20)
            // Si el puntaje es de 5 (absolutamente todas en A), se asigna Paracetamol (1) por la baja probabilidad solicitada.
            // A partir de 6 puntos en adelante, se asigna Next (3).
            if (puntosTotales === 5) {
                resultadoRuta = 1;
                nombrePastilla = 'Paracetamol';
            } else {
                resultadoRuta = 3;
                nombrePastilla = 'Next';
            }

            // Guardamos las variables en el almacenamiento local con los nombres exactos requeridos
            localStorage.setItem('resultadoRuta', resultadoRuta);
            localStorage.setItem('nombrePastilla', nombrePastilla);

            // Redirige a la página 'rutas.html'
            window.location.href = 'rutas.html';
        });
    </script>
    
</body>
</html>
